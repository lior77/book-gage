name: Build HebSub APK

on:
  push:
    branches: [claude/hebrew-subtitle-video-app-8fbftq]
    paths:
      - "app/**"
      - "core/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null || true
          yes | sdkmanager --licenses >/dev/null || true

      - name: Build debug APK (full — with FFmpeg)
        run: ./gradlew :app:assembleDebug -PwithFfmpeg --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/HebSub-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HebSub-debug-apk
          path: dist/HebSub-debug.apk
          if-no-files-found: error

      - name: Publish downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="hebsub-latest"
          NOTES="Debug-signed, installable APK built from ${{ github.sha }} with FFmpeg (probe, embedded-subtitle extraction, and new-media-file creation). arm64-v8a (Galaxy A56). Enable 'install from unknown sources', install HebSub-debug.apk, then enter your OpenSubtitles and Anthropic API keys in Settings on first run."
          # Remove any previous release (published OR a leftover untagged draft) and
          # its tag, then wait for the tag-ref deletion to propagate. Deleting and
          # immediately recreating races GitHub's ref cache and can otherwise leave
          # an untagged DRAFT release, whose asset URL 404s.
          gh release delete "$TAG" --yes --cleanup-tag || true
          # Also drop any stray draft releases that point at this tag name.
          for id in $(gh api repos/${{ github.repository }}/releases --jq ".[] | select(.tag_name==\"$TAG\") | .id"); do
            gh api -X DELETE "repos/${{ github.repository }}/releases/$id" || true
          done
          git push --delete origin "refs/tags/$TAG" 2>/dev/null || true
          sleep 8
          # Create a fresh, PUBLISHED release; retry to ride out propagation races.
          ok=""
          for i in 1 2 3 4; do
            if gh release create "$TAG" dist/HebSub-debug.apk \
                --target "${{ github.sha }}" \
                --title "HebSub — installable APK (full)" \
                --notes "$NOTES"; then
              ok=1; break
            fi
            echo "release create attempt $i failed; retrying in 8s"; sleep 8
          done
          [ -n "$ok" ] || { echo "release create failed after retries"; exit 1; }
          # Force it public (never a draft) and verify the asset is attached.
          gh release edit "$TAG" --draft=false --latest || true
          echo "--- release state ---"
          gh release view "$TAG" --json isDraft,tagName,assets \
            -q '"isDraft=\(.isDraft) tag=\(.tagName) assets=\([.assets[].name]|join(","))"'
