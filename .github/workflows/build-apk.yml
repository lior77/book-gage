name: Build Android APK

on:
  push:
    branches:
      - claude/medication-reminder-app-vgp101
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MedReminder.apk

      - name: Publish APK to a Release (permanent download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: תזכורת תרופות — APK להתקנה
          body: |
            קובץ ההתקנה האחרון של אפליקציית "תזכורת תרופות".
            הורד את הקובץ MedReminder.apk אל הטלפון והתקן אותו.
          files: MedReminder.apk
          make_latest: true
