# Builds the Porto atlas as an Android APK.
#
# It runs here rather than on a developer's machine because the Android build
# tools — aapt2 and d8 — are published only from dl.google.com, and the
# environment the app is developed in cannot reach it.  GitHub's runners carry
# the SDK already, so the build happens where the tools are.
#
# The result is a debug-signed APK: installable by sideloading, no secrets and
# no signing key needed.  Download it from the run's Artifacts section.
name: Porto atlas — Android APK

on:
  workflow_dispatch:
  push:
    branches: [claude/mobile-app-pdf-knowledge-aoomsp]
    paths:
      - 'porto/android/**'
      - 'porto/index.html'
      - 'porto/app.js'
      - 'porto/app.css'
      - 'porto/data/processed/**'
      - '.github/workflows/porto-android-apk.yml'

# write: the built APK is published as a release asset, so it has a direct
# download link that works from a phone without signing in to GitHub
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      # Optional, and the build says plainly which way it went.  With the
      # secret the app updates in place and keeps the points the user saved;
      # without it every build carries a different key and an update can only
      # be installed by uninstalling first.
      - name: Signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/porto.jks"
            {
              echo "PORTO_KEYSTORE=$RUNNER_TEMP/porto.jks"
              echo "PORTO_KEYSTORE_PASSWORD=$KS_PASS"
              echo "PORTO_KEY_ALIAS=${KS_ALIAS:-porto}"
              echo "PORTO_KEY_PASSWORD=${KEY_PASS:-$KS_PASS}"
            } >> "$GITHUB_ENV"
            echo "signing with the stored key: updates will install over an existing copy"
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret. Signing with a throwaway debug key, so this build cannot be installed over an earlier one without uninstalling first — which deletes the points saved in the app. See porto/android/SIGNING.md."
          fi

      - name: Build the APK
        working-directory: porto/android
        run: gradle --no-daemon assembleDebug

      - name: What came out
        working-directory: porto/android
        run: |
          find . -name '*.apk' -printf '%p  %sB\n'
          echo "--- assets that went in:"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -c 'assets/site/' || true

      # Whether an update installs over an existing copy — keeping the points
      # the user saved — or is refused for a signature mismatch depends
      # entirely on the debug key being the same one every build.  Gradle
      # creates ~/.android/debug.keystore when it is missing, with a fresh
      # random key, so this prints what was actually used rather than assuming.
      - name: Which key signed it
        working-directory: porto/android
        run: |
          echo "keystore present: $(test -f ~/.android/debug.keystore && echo yes || echo no)"
          sha256sum ~/.android/debug.keystore || true
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort | tail -1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk \
            | grep -i 'SHA-256 digest\|Subject' || true

      - uses: actions/upload-artifact@v4
        with:
          name: porto-atlas-apk
          path: porto/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # A release asset rather than only a run artifact: an artifact is a zip
      # and needs a signed-in GitHub account, which is two awkward steps on the
      # phone the app is for.  The tag is fixed so the download link never
      # changes; each build replaces the file behind it.
      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp porto/android/app/build/outputs/apk/debug/app-debug.apk /tmp/porto-atlas.apk
          TAG=porto-atlas
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "אטלס מחוז פורטו — אפליקציית אנדרואיד" \
              --notes-file porto/android/RELEASE_NOTES.md
          fi
          gh release upload "$TAG" /tmp/porto-atlas.apk --clobber
          gh release view "$TAG" --json url,assets --jq '.url, (.assets[].url)'
