<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<title>מחוז פורטו — מפה ונתונים</title>
<meta name="description" content="מסך מחולק לשניים: מפה של מחוז פורטו מצד אחד, וכל הידע על 18 העיריות, 243 הפרגזיות ו-53 שכונות פורטו מצד שני.">
<meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#1b4f8c" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div id="boot" class="boot"><div class="boot-in"><div class="spin"></div><p>טוען את נתוני המחוז…</p></div></div>

<header class="top">
  <button class="ico" id="upBtn" aria-label="חזרה לרמה שמעל" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
  </button>
  <nav class="crumb" id="crumb" aria-label="מסלול ניווט"></nav>
  <button class="ico" id="viewBtn" aria-label="פריסת המסך">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 12h18"/></svg>
  </button>
  <button class="ico" id="findBtn" aria-label="חיפוש">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>
  </button>
  <button class="ico" id="tilesBtn" aria-label="רקע המפה" aria-pressed="true">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3 7.5 12 12l9-4.5L12 3zM3 12l9 4.5L21 12M3 16.5 12 21l9-4.5"/></svg>
  </button>
  <button class="ico" id="infoBtn" aria-label="מקורות ומידע חסר">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>
  </button>
</header>

<!-- The two halves.  Portrait: map above, text below.  Landscape: map at the
     start of the line (left, in this RTL layout) and the text beside it.
     --f is the share of the split the map gets; the divider drags it. -->
<main class="split" id="split" style="--f:52%">
  <section class="pane pane-map" id="paneMap" aria-label="מפה">
    <div id="map" role="application" aria-label="מפת מחוז פורטו"></div>
    <div class="map-tools">
      <button class="mt" id="fitBtn" aria-label="התאמת המפה למסך">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
      <button class="mt" id="locBtn" aria-label="הצגת המיקום שלי" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </button>
      <button class="mt" id="layersBtn" aria-label="שכבות המפה" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3 7.5 12 12l9-4.5L12 3zM3 12l9 4.5L21 12M3 16.5 12 21l9-4.5"/></svg>
      </button>
      <button class="mt" id="addBtn" aria-label="הוספת נקודה משלי" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <p class="tile-note" id="tileNote" role="status" hidden></p>
    <div class="map-note" id="locNote" role="status" hidden></div>
    <div class="panel" id="layerPanel" hidden role="group" aria-label="שכבות המפה"></div>
    <div class="map-note" id="addNote" role="status" hidden></div>
    <p class="attrib">© OpenStreetMap contributors · גבולות: CAOP 2020, DGT</p>
  </section>

  <div class="divider" id="divider" role="separator" tabindex="0"
       aria-orientation="horizontal" aria-label="הזזת הקו משנה את גודל המפה"
       aria-valuemin="15" aria-valuemax="85" aria-valuenow="52"><span class="grip"></span></div>

  <section class="pane pane-text" id="paneText" aria-label="נתונים">
    <div class="doc" id="doc"></div>
  </section>
</main>

<div class="drawer" id="findDrawer" hidden role="dialog" aria-modal="true" aria-label="חיפוש">
  <div class="drawer-in">
    <div class="drawer-head">
      <input id="q" type="search" inputmode="search" autocomplete="off" enterkeyhint="search"
             placeholder="עירייה, פרגזיה, שכונה או אתר" aria-label="חיפוש">
      <button class="ico" id="findClose" aria-label="סגירה"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="drawer-body" id="qres"></div>
  </div>
</div>

<div class="drawer" id="infoDrawer" hidden role="dialog" aria-modal="true" aria-labelledby="infoTitle">
  <div class="drawer-in">
    <div class="drawer-head">
      <h2 id="infoTitle">מקורות, דיוק ומה שחסר</h2>
      <button class="ico" id="infoClose" aria-label="סגירה"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="drawer-body doc" id="infoBody"></div>
  </div>
</div>

<div class="modal" id="mineModal" hidden role="dialog" aria-modal="true" aria-labelledby="mineTitle">
  <div class="modal-in">
    <h2 id="mineTitle">נקודה משלי</h2>
    <p class="note" id="mineWhere"></p>
    <label class="fld-l" for="mineName">שם</label>
    <input id="mineName" type="text" autocomplete="off" placeholder="למשל: דירה שראיתי">
    <label class="fld-l" for="mineDesc">תיאור</label>
    <textarea id="mineDesc" rows="4" placeholder="מה שחשוב לזכור על המקום הזה"></textarea>
    <button class="cta" id="mineSave">שמירה</button>
    <button class="cta cta-2" id="mineGoogle">פתיחה במפות גוגל</button>
    <button class="cta cta-2" id="mineDelete" hidden>מחיקת הנקודה</button>
    <button class="cta cta-2" id="mineCancel">ביטול</button>
  </div>
</div>

<div class="modal" id="impModal" hidden role="dialog" aria-modal="true" aria-labelledby="impTitle">
  <div class="modal-in">
    <h2 id="impTitle">ייבוא נקודות</h2>
    <p class="note" id="impNote"></p>
    <textarea id="impText" rows="7" dir="ltr" spellcheck="false"></textarea>
    <button class="cta" id="impSave">ייבוא</button>
    <button class="cta cta-2" id="impCancel">סגירה</button>
  </div>
</div>

<div class="modal" id="srcModal" hidden role="dialog" aria-modal="true" aria-labelledby="srcTitle">
  <div class="modal-in">
    <h2 id="srcTitle"></h2>
    <div id="srcBody"></div>
    <button class="cta" id="srcClose">סגירה</button>
  </div>
</div>

<script src="vendor/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
