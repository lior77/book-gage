<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<title>פורטולנד</title>
<meta name="description" content="פורטולנד — מפה וכל הידע על מחוז פורטו: 18 עיריות, 243 רובעים, 1,771 יישובים ו-1,530 אתרים, בלי רשת.">
<meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#1b4f8c" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div id="boot" class="boot"><div class="boot-in"><div class="spin"></div><p>טוען את נתוני המחוז…</p></div></div>

<!-- The two halves.  Portrait: map above, text below.  Landscape: map at the
     start of the line (left, in this RTL layout) and the text beside it.
     Half and half, fixed: --f is a constant now and the seam between them is a
     line rather than a handle. -->
<main class="split" id="split">
  <section class="pane pane-map" id="paneMap" aria-label="מפה">
    <div id="map" role="application" aria-label="מפת מחוז פורטו"></div>
  </section>

  <div class="seam" aria-hidden="true"></div>

  <!-- The three that live on the map itself: the way into the menu, beside it
       the home button that goes back to the district, and at the far end of the
       same band the trail of where you are.  All are 10px in from the map's top
       edge and 38px tall, so the band they share is one strip the map keeps
       clear — everything else is inside the menu. -->
  <button class="mt menu-btn" id="menuBtn" aria-label="תפריט"
          aria-expanded="false" aria-controls="menu">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <button class="mt reset-btn" id="homeBtn" aria-label="חזרה למחוז">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.5 12 4l8.5 7.5"/><path d="M5.5 10.2V20h13v-9.8"/><path d="M9.8 20v-5.6h4.4V20"/></svg>
  </button>

  <!-- The trail, at the end of the button band rather than in a bar under the
       screen: two lines, the level above and the one being looked at. -->
  <nav class="crumb" id="crumb" aria-label="מסלול ניווט"></nav>

  <!-- The menu is a screen, not a strip: it covers the map area on an opaque
       bluish grey, and its close button sits exactly where the menu button was,
       so the same corner opens it and shuts it.  The list itself is built in
       app.js from MENU, because every row has to show its own state. -->
  <nav class="menu" id="menu" hidden aria-label="תפריט">
    <button class="mt menu-x" id="menuClose" aria-label="סגירת התפריט">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="menu-in" id="menuIn"></div>
  </nav>

  <!-- Two buttons on the map while a place is being chosen there.  The map is
       on both halves then, so a note in the text half would be off screen. -->
  <div class="pick-bar" id="pickBar" hidden>
    <button class="chip is-on" data-wpact="fix" data-t="בחירה">בחירה</button>
    <button class="chip" data-add="off" data-t="ביטול">ביטול</button>
  </div>

  <section class="pane pane-text" id="paneText" aria-label="נתונים">
    <div class="msgs" id="msgs" role="status" aria-live="polite"></div>
    <div class="panel" id="panel" hidden role="region" aria-labelledby="panelTitle">
      <div class="panel-h">
        <h2 id="panelTitle"></h2>
        <button class="msg-x" type="button" id="panelClose" aria-label="סגירה">✕</button>
      </div>
      <div id="panelBody"></div>
    </div>
    <div class="doc" id="doc"></div>
  </section>
</main>

<!-- The place form: from the top of the display down to whatever the keyboard
     leaves.  app.js measures that with visualViewport and sets the height. -->
<section class="sheet" id="wpSheet" hidden aria-label="פרטי המקום"></section>

<div class="drawer" id="infoDrawer" hidden role="dialog" aria-modal="true" aria-labelledby="infoTitle">
  <div class="drawer-in">
    <div class="drawer-head">
      <h2 id="infoTitle" data-t="מקורות, דיוק ומה שחסר">מקורות, דיוק ומה שחסר</h2>
      <button class="ico" id="infoClose" aria-label="סגירה"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="drawer-body doc" id="infoBody"></div>
  </div>
</div>

<script src="vendor/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
